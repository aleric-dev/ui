name: Validate PR Title (Conventional Commits)

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-title:
    name: Conventional Commit Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title conforms to Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tipos permitidos según estándar de versionado SemVer de Aleric UI
          types: |
            feat
            fix
            hotfix
            refactor
            perf
            style
            chore
            docs
            test
            ci
            build
          # Requiere que al menos un tipo sea el prefijo
          requireScope: false
          # Mensaje amigable en caso de fallo
          headerPattern: '^(\w+)(?:\(([^)]+)\))?!?: (.+)$'
          headerPatternCorrespondence: type,scope,subject
