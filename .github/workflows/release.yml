name: Automated Release & Tagging

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto Changelog, Version Bump & Tag
    if: "!startsWith(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute Next SemVer & Generate Changelog
        id: release
        run: node scripts/auto-release.cjs

      - name: Build Library Bundles & Showcase
        if: steps.release.outputs.has_release == 'true'
        run: |
          npm run build:lib
          npm run build

      - name: Commit Version Bump & Tag
        if: steps.release.outputs.has_release == 'true'
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.release.outputs.tag }}"
          git tag ${{ steps.release.outputs.tag }}
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.release.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          body_path: RELEASE_NOTES.tmp.md
          draft: false
          prerelease: false
          files: |
            dist/index.js
            dist/index.cjs
            dist/ui.css
            dist/index.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM Registry
        if: steps.release.outputs.has_release == 'true' && env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
